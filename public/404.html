<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Multiverse | MCU Universe Tracker</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons8-avengers.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            background-color: #1a1a24;
            border: 1px solid #272733;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .badge {
            display: inline-block;
            background-color: #e23636;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(226, 54, 54, 0.4);
        }
        .error-code {
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            color: #e23636;
            margin-bottom: 12px;
            letter-spacing: -0.04em;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #9ca3af;
            margin-bottom: 28px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #e23636;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(226, 54, 54, 0.3);
        }
        .home-btn:hover {
            background-color: #c52b2b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(226, 54, 54, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">MCU Universe Tracker</span>
        <div class="error-code">404</div>
        <h1>Lost in the Multiverse</h1>
        <p>The timeline or page you are looking for has been pruned or does not exist in this universe.</p>
        <a href="/" class="home-btn">Return to Tracker</a>
    </div>
</body>
</html>
