<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#1a1a24"/>
  <rect x="1" y="1" width="398" height="598" fill="none" stroke="#2a2a36" stroke-width="2" rx="12"/>
  
  <!-- Film / Clapperboard Icon in Marvel Red #e23636 -->
  <g transform="translate(156, 240)">
    <!-- Clapper top slate -->
    <path d="M4 0 L84 0 C86.2 0 88 1.8 88 4 L88 20 L0 20 L0 4 C0 1.8 1.8 0 4 0 Z" fill="#e23636"/>
    <!-- Clapper stripes -->
    <polygon points="16,0 6,20 16,20 26,0" fill="#1a1a24"/>
    <polygon points="38,0 28,20 38,20 48,0" fill="#1a1a24"/>
    <polygon points="60,0 50,20 60,20 70,0" fill="#1a1a24"/>
    
    <!-- Clapperboard body -->
    <rect x="0" y="24" width="88" height="62" rx="4" fill="#e23636"/>
    <!-- Center film play symbol -->
    <circle cx="44" cy="55" r="15" fill="#1a1a24" opacity="0.35"/>
    <polygon points="40,48 52,55 40,62" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Subtle text "Poster coming soon" -->
  <text x="200" y="365" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.3">Poster coming soon</text>
</svg>
