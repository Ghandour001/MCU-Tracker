        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">

                    { id: "av5", title: "Avengers: Doomsday", year: "2026", duration: "TBD", imdb: "N/A", poster: wikiBase + "Avengers_Doomsday_poster.jpg" + wikiEnd },
                    { id: "av6", title: "Avengers: Secret Wars", year: "2027", duration: "TBD", imdb: "N/A", poster: "" }
                ]
            },
            {
                phase: "Future",
                title: "Upcoming Projects",
                movies: [
                    { id: "bp3", title: "Black Panther 3", year: "2028", duration: "TBD", imdb: "N/A", poster: "" },
                    { id: "aw", title: "Armor Wars", year: "TBD", duration: "TBD", imdb: "N/A", poster: "" },
                    { id: "bl", title: "Blade", year: "TBD", duration: "TBD", imdb: "N/A", poster: "" },
                    { id: "sc2", title: "Untitled Shang-Chi Sequel", year: "TBD", duration: "TBD", imdb: "N/A", poster: "" },
                    { id: "xm", title: "Untitled X-Men Film", year: "TBD", duration: "TBD", imdb: "N/A", poster: "" }
                ]
            }
        ];

        let userProgress = {};
        let totalMovies = 0;
        const STORAGE_KEY = 'mcu_tracker_progress';

        // Count total movies
        mcuData.forEach(phase => {
            totalMovies += phase.movies.length;
        });

        // Initialize App
        function initApp() {
            loadProgress();
            renderUI();
            updateUIState();
        }

        // Load progress from Local Storage
        function loadProgress() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    userProgress = JSON.parse(stored);
                }
            } catch (error) {
                console.error("Error loading progress:", error);
                userProgress = {};
            }
        }

        // Save progress to Local Storage
        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
            } catch (error) {
                console.error("Error saving progress:", error);
            }
        }

        function renderUI() {
            const container = document.getElementById('movies-container');
            const loading = document.getElementById('loading-state');
            
            let html = '';

            mcuData.forEach((phaseObj, pIndex) => {
                html += `
                    <div class="phase-section">
                        <div class="flex flex-col md:flex-row md:items-end justify-between mb-5 border-b border-gray-800 pb-2">
                            <div>
                                <h2 class="text-3xl md:text-4xl font-black text-white tracking-tight">${phaseObj.phase}</h2>
                                <p class="text-marvel font-semibold tracking-wide text-sm md:text-base mt-1 uppercase">${phaseObj.title}</p>
                            </div>
                            <div class="text-gray-400 text-sm font-semibold mt-2 md:mt-0 bg-gray-900 px-3 py-1 rounded-full border border-gray-800" id="phase-progress-${pIndex}">
                                0 / ${phaseObj.movies.length} Watched
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                `;

                phaseObj.movies.forEach(movie => {
                    // Fallback URL for future movies without posters
                    const fallbackUrl = `https://placehold.co/400x600/1a1a24/666666?text=${encodeURIComponent(movie.title.replace(/:/g, ':\n').replace(/ /g, '+'))}&font=montserrat`;
                    const imageSrc = movie.poster ? movie.poster : fallbackUrl;
                    
                    // IMDb Badge setup
                    const imdbBadge = movie.imdb && movie.imdb !== "N/A" 
                        ? `<div class="absolute top-2 right-2 bg-black/80 text-yellow-500 text-xs font-bold px-2 py-1 rounded-md z-30 backdrop-blur-sm border border-yellow-500/30 shadow-lg flex items-center gap-1"><i class="fas fa-star"></i> ${movie.imdb}</div>` 
                        : '';
                    
                    html += `
                        <div class="movie-card relative bg-cardbg rounded-xl overflow-hidden cursor-pointer group border border-gray-800 flex flex-col h-full shadow-md" 
                             onclick="toggleMovie('${movie.id}')"
                             id="card-${movie.id}">
                            
                            <!-- Poster Area -->
                            <div class="relative aspect-[2/3] w-full bg-gray-900 overflow-hidden flex items-center justify-center">
                                ${imdbBadge}
                                <!-- Image Tag -->
                                <img src="${imageSrc}" 
                                     onerror="this.onerror=null; this.src='${fallbackUrl}';"
                                     onload="document.getElementById('spinner-${movie.id}').style.display='none'"
                                     alt="${movie.title} poster" 
                                     class="poster-image w-full h-full object-cover opacity-80 group-hover:opacity-100 z-10 relative" 
                                     id="img-${movie.id}">
                                
                                <!-- Loading Spinner -->
                                <div id="spinner-${movie.id}" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-0 pointer-events-none">
                                    <i class="fas fa-spinner fa-spin text-gray-700 text-2xl"></i>
                                </div>
                                
                                <!-- Check Overlay -->
                                <div id="overlay-${movie.id}" class="check-overlay absolute inset-0 bg-black/65 flex items-center justify-center opacity-0 z-20 backdrop-blur-[2px]">
                                    <div class="bg-marvel text-white rounded-full w-14 h-14 flex items-center justify-center transform scale-50 transition-transform duration-300 shadow-[0_0_15px_rgba(226,54,54,0.7)]" id="check-icon-${movie.id}">
                                        <i class="fas fa-check text-2xl"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Details Area -->
                            <div class="p-4 flex-grow flex flex-col justify-between bg-gradient-to-t from-cardbg to-gray-900 border-t border-gray-800">
                                <h3 class="font-bold text-sm md:text-base text-gray-100 leading-tight mb-3">${movie.title}</h3>
                                
                                <div class="flex justify-between items-center text-xs font-semibold text-gray-400">
                                    <span class="bg-darkbg px-2 py-1 rounded shadow-inner border border-gray-800"><i class="far fa-calendar-alt text-marvel/80 mr-1"></i>${movie.year}</span>
                                    <span class="bg-darkbg px-2 py-1 rounded shadow-inner border border-gray-800"><i class="far fa-clock text-marvel/80 mr-1"></i>${movie.duration}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            loading.style.display = 'none';
            container.style.display = 'flex';
        }

        window.toggleMovie = function(movieId) {
            const isWatched = !userProgress[movieId];
            userProgress[movieId] = isWatched;
            saveProgress();
            updateUIState();
        };

        function updateUIState() {
            let totalWatched = 0;

            mcuData.forEach((phaseObj, pIndex) => {
                let phaseWatched = 0;

                phaseObj.movies.forEach(movie => {
                    const isWatched = userProgress[movie.id];
                    const card = document.getElementById(`card-${movie.id}`);
                    const overlay = document.getElementById(`overlay-${movie.id}`);
                    const checkIcon = document.getElementById(`check-icon-${movie.id}`);
                    
                    if (card && overlay && checkIcon) {
                        if (isWatched) {
                            phaseWatched++;
                            totalWatched++;
                            
                            // Visuals for watched state
                            card.classList.add('border-marvel');
                            card.classList.remove('border-gray-800');
                            overlay.classList.remove('opacity-0');
                            overlay.classList.add('opacity-100');
                            checkIcon.classList.remove('scale-50');
                            checkIcon.classList.add('scale-100');
                        } else {
                            // Visuals for unwatched state
                            card.classList.remove('border-marvel');
                            card.classList.add('border-gray-800');
                            overlay.classList.add('opacity-0');
                            overlay.classList.remove('opacity-100');
                            checkIcon.classList.add('scale-50');
                            checkIcon.classList.remove('scale-100');
                        }
                    }
                });

                // Update Phase Progress
                const phaseProgressEl = document.getElementById(`phase-progress-${pIndex}`);
                if (phaseProgressEl) {
                    phaseProgressEl.innerHTML = `<span class="${phaseWatched === phaseObj.movies.length ? 'text-marvel font-bold' : 'text-gray-200'}">${phaseWatched}</span> / ${phaseObj.movies.length} Watched`;
                }
            });

            // Update Overall Progress Bar
            const progressPercent = totalMovies === 0 ? 0 : Math.round((totalWatched / totalMovies) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `${progressPercent}% (${totalWatched}/${totalMovies})`;
        }

        // Initialize App on load
        window.onload = initApp;
    </script>
